<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Light Dashboard</title>
  <style>
    :root{color-scheme:light;--ink:#17202b;--muted:#667085;--line:#e1e5ea;--paper:#fff;--bg:#f5f6f8;--blue:#3157d5;--amber:#bb7a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:15px max(20px,4vw);background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{margin:0 auto 0 0;font-size:18px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px}input{width:min(360px,32vw)}main{max-width:1200px;margin:auto;padding:24px}.intro{color:var(--muted);margin:0 0 20px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pill{padding:4px 9px;border-radius:999px;background:#e9ecf1;color:var(--muted)}.stream{margin:26px 0}.stream h2{font-size:15px;margin:0 0 10px}.columns{display:grid;grid-template-columns:2fr 1fr;gap:16px}.columns.done{grid-template-columns:1fr}.column h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.card{margin:9px 0;padding:15px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 1px 2px #10182808;cursor:pointer}.card.review{border-left:3px solid var(--amber)}.card:hover{border-color:#b9c2cf}.card-head{display:flex;gap:12px}.card strong{flex:1;font-size:15px}.copy{border:0;padding:1px 3px;color:var(--blue)}.meta{margin-top:8px;color:var(--muted);font-size:12px}.empty{padding:48px;text-align:center;color:var(--muted)}dialog{width:min(820px,calc(100vw - 32px));max-height:calc(100vh - 32px);border:1px solid var(--line);border-radius:12px;padding:0}dialog::backdrop{background:#11182766}.dialog-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px}.dialog-head button{margin-left:auto;border:0;font-size:20px}.dialog-body{padding:20px 22px}.path{color:var(--muted);font-family:ui-monospace,monospace}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:16px}.error{color:#b42318}@media(max-width:760px){header{flex-wrap:wrap}h1{width:100%}input{flex:1;width:auto}.columns{grid-template-columns:1fr}main{padding:18px}}
  </style>
</head>
<body>
  <header>
    <h1>Light Dashboard</h1>
    <input id="search" type="search" placeholder="搜索任务、负责人或正文…">
    <select id="stream" aria-label="按 stream 筛选"><option value="">全部 stream</option></select>
    <select id="scope" aria-label="按状态筛选"><option value="active">活动任务</option><option value="done">已归档</option></select>
  </header>
  <main>
    <p class="intro">网页是只读投影。Agent 直接更新 <code>docs/tasks/</code>，这里每两秒刷新一次。</p>
    <div id="summary" class="summary"></div>
    <div id="board"><div class="empty">正在读取 Task MD…</div></div>
  </main>
  <dialog id="details"><div class="dialog-head"><h2></h2><button aria-label="关闭">×</button></div><div class="dialog-body"></div></dialog>
  <script>
    const state={tasks:[],query:'',stream:'',scope:'active'};
    const board=document.querySelector('#board');
    const details=document.querySelector('#details');
    const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const visible=(task)=>{
      const scope=state.scope==='done'?task.status==='done':task.status!=='done';
      const stream=!state.stream||(task.stream??'未分流')===state.stream;
      const haystack=[task.title,task.owner,task.stream,task.body].join(' ').toLocaleLowerCase();
      return scope&&stream&&haystack.includes(state.query);
    };
    function promptFor(task){return `执行任务 ${task.id}，遵循 AGENTS.md。\n先运行 node tools/board/task.mjs show ${task.id}，读取 Task MD 与当前 Git 状态；修改前写计划，执行中持续写进展。完成并验证后运行 node tools/board/task.mjs done ${task.id} --feedback "结果与验证证据"，再次 show 确认 review，再运行 npm run board:check。不要自行 approve。`;}
    function card(task){return `<article class="card ${task.status}" data-id="${escapeHtml(task.id)}"><div class="card-head"><strong>${escapeHtml(task.title)}</strong>${task.status!=='done'?'<button class="copy">复制 Prompt</button>':''}</div><div class="meta">${escapeHtml(task.id)} · ${escapeHtml(task.status)}${task.owner?` · ${escapeHtml(task.owner)}`:''}${task.due?` · 截止 ${escapeHtml(task.due)}`:''}</div></article>`;}
    function render(){
      const tasks=state.tasks.filter(visible);
      const counts=Object.fromEntries(['todo','review','done'].map(status=>[status,state.tasks.filter(task=>task.status===status).length]));
      document.querySelector('#summary').innerHTML=`<span class="pill">todo ${counts.todo}</span><span class="pill">review ${counts.review}</span><span class="pill">done ${counts.done}</span>`;
      const groups=tasks.reduce((map,task)=>{const key=task.stream??'未分流';if(!map.has(key))map.set(key,[]);map.get(key).push(task);return map;},new Map());
      board.innerHTML=[...groups].sort(([a],[b])=>a.localeCompare(b)).map(([stream,items])=>{
        const todo=items.filter(task=>task.status==='todo'); const review=items.filter(task=>task.status==='review'); const done=items.filter(task=>task.status==='done');
        const content=state.scope==='done'?`<div class="columns done"><div class="column"><h3>已归档</h3>${done.map(card).join('')}</div></div>`:`<div class="columns"><div class="column"><h3>待完成</h3>${todo.map(card).join('')||'<div class="empty">—</div>'}</div><div class="column"><h3>待审核</h3>${review.map(card).join('')||'<div class="empty">—</div>'}</div></div>`;
        return `<section class="stream"><h2>${escapeHtml(stream)} <span class="pill">${items.length}</span></h2>${content}</section>`;
      }).join('')||'<div class="empty">没有匹配的任务</div>';
    }
    function updateStreams(){
      const select=document.querySelector('#stream'); const previous=select.value;
      const names=[...new Set(state.tasks.map(task=>task.stream??'未分流'))].sort();
      select.innerHTML='<option value="">全部 stream</option>'+names.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
      if(names.includes(previous)) select.value=previous;
    }
    async function refresh(){
      if(document.hidden||details.open)return;
      try{const response=await fetch('/api/tasks',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);state.tasks=(await response.json()).tasks;updateStreams();render();}
      catch(error){board.innerHTML=`<div class="empty error">读取失败：${escapeHtml(error.message)}</div>`;}
    }
    board.addEventListener('click',async(event)=>{
      const element=event.target.closest('.card');if(!element)return;const task=state.tasks.find(item=>item.id===element.dataset.id);if(!task)return;
      if(event.target.closest('.copy')){event.stopPropagation();await navigator.clipboard.writeText(promptFor(task));event.target.textContent='已复制';return;}
      details.querySelector('h2').textContent=task.title;details.querySelector('.dialog-body').innerHTML=`<p class="path">${escapeHtml(task.relativePath)}</p><pre>${escapeHtml(task.body)}</pre>`;details.showModal();
    });
    details.querySelector('button').addEventListener('click',()=>details.close());
    details.addEventListener('close',refresh);
    document.querySelector('#search').addEventListener('input',event=>{state.query=event.target.value.trim().toLocaleLowerCase();render();});
    document.querySelector('#stream').addEventListener('change',event=>{state.stream=event.target.value;render();});
    document.querySelector('#scope').addEventListener('change',event=>{state.scope=event.target.value;render();});
    refresh();setInterval(refresh,2000);
  </script>
</body>
</html>
