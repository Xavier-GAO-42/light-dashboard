<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Dashboard</title>
  <link rel="stylesheet" href="/board.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">L</span><span>Light Dashboard</span></div>
    <div class="search-tools">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题、正文、负责人或标签…" autocomplete="off"></label>
      <button id="clear-search" class="clear-search" type="button" hidden>清除</button>
    </div>
    <button id="new-task" class="primary">新建任务</button>
    <button id="manage-tags">自定义标签</button>
    <button id="energy-saving" class="energy-saving" type="button" role="switch" aria-checked="false" aria-label="节能模式" title="开启后，复制 Prompt 将加入子 Agent / GPT-6 委派建议，以减少协调 Agent 的上下文消耗">
      <span class="switch-track" aria-hidden="true"></span><span>节能模式</span><span id="energy-saving-state">关</span>
    </button>
  </header>
  <nav id="tabs" class="tabs" aria-label="任务线">
    <button class="tab active" data-view="inbox">inbox · 提醒 <span></span></button>
    <button class="tab" data-view="L">L · 发行 <span></span></button>
    <button class="tab" data-view="G">G · 增长 <span></span></button>
    <button class="tab" data-view="P">P · 产品 <span></span></button>
    <button class="tab" data-view="R">R · 研究 <span></span></button>
    <button class="tab" data-view="archive">归档 <span></span></button>
  </nav>
  <main id="board" aria-live="polite"><div class="loading">正在读取任务…</div></main>

  <dialog id="task-dialog" class="dialog task-dialog">
    <form id="task-form" method="dialog">
      <div class="dialog-head"><h2 id="task-dialog-title">任务详情</h2><button type="button" class="icon close-dialog" aria-label="关闭">×</button></div>
      <div class="form-grid">
        <label class="wide">标题<input name="title" required maxlength="240"></label>
        <label>线<select name="line"><option value="inbox">inbox · 提醒</option><option value="L">L · 发行</option><option value="G">G · 增长</option><option value="P">P · 产品</option><option value="R">R · 研究</option></select></label>
        <label>阶段<input name="phase" type="number" min="0" max="9"></label>
        <label>负责人<input name="owner" placeholder="human / fable / codex / 人名"></label>
        <label>轨道<input name="track" placeholder="A–F、C+A 或 all"></label>
        <label>截止日<input name="due" type="date"></label>
        <fieldset class="wide"><legend>标签</legend><div class="task-tag-tools"><div id="task-tags" class="tag-choices"></div><button id="quick-add-tag" type="button" class="quick-add-tag" aria-label="为当前任务线快速新建标签">+</button></div></fieldset>
        <label class="wide">Prompt<textarea name="body" rows="12" placeholder="写给 AI 的任务 Prompt，支持 Markdown"></textarea></label>
      </div>
      <p id="inbox-note" class="hint" hidden>这是提醒，不是任务：它不进「完成 → 审核」。要做它，把上面的「线」改成 L / G / P / R 并填阶段再保存；不做就删掉。</p>
      <section id="task-history" class="task-history" hidden>
        <h3>记录 <span id="history-count" class="count"></span></h3>
        <ol id="history-list" class="history-list"></ol>
      </section>
      <div class="dialog-actions">
        <button id="delete-task" type="button" class="danger">删除</button>
        <span class="spacer"></span>
        <button type="button" class="close-dialog">取消</button>
        <button id="save-task" type="submit" class="primary">保存</button>
        <button id="state-action" type="button" class="primary"></button>
        <button id="reject-task" type="button" class="danger">打回</button>
      </div>
    </form>
  </dialog>

  <dialog id="prompt-dialog" class="dialog prompt-dialog">
    <form id="prompt-form" method="dialog">
      <div class="dialog-head"><h2 id="prompt-title"></h2><button type="button" class="icon close-prompt" aria-label="关闭">×</button></div>
      <label><span id="prompt-label"></span><textarea id="prompt-value" rows="7" required></textarea></label>
      <div class="dialog-actions"><span class="spacer"></span><button type="button" class="close-prompt">取消</button><button type="submit" class="primary">确认</button></div>
    </form>
  </dialog>

  <dialog id="tags-dialog" class="dialog tags-dialog">
    <div class="dialog-head"><h2>自定义标签</h2><button type="button" class="icon close-tags" aria-label="关闭">×</button></div>
    <label class="tag-line-picker">任务线<select id="tags-line"><option value="inbox">inbox</option><option value="L">L · 发行</option><option value="G">G · 增长</option><option value="P">P · 产品</option><option value="R">R · 研究</option></select></label>
    <form id="new-tag-form" class="new-tag"><input name="name" placeholder="标签名" required><input name="color" type="color" value="#5269a8"><button class="primary">新建</button></form>
    <p class="hint">每条线维护自己的标签；拖动可排序。删除标签时，会同时从该线引用它的任务中移除。</p>
    <div id="tag-list" class="tag-list"></div>
  </dialog>

  <form id="tag-delete-form" method="post" hidden></form>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/board.js?v=1"></script>
</body>
</html>
